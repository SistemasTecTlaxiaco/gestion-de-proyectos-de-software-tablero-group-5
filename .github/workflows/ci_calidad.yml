name: "CI Aseguramiento de Calidad y Linteo - Grupo 5"

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  verificacion-calidad:
    name: "Auditoría de Calidad, Tablero y Matriz de Riesgos (Sprint 3)"
    runs-on: ubuntu-latest

    steps:
      - name: "Descargar Repositorio"
        uses: actions/checkout@v4

      - name: "Configurar Entorno Python"
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: "Verificar Integridad de Documentación Maestras (Unidad 3)"
        run: |
          echo "Verificando existencia de documentos maestros de Planificación..."
          test -f docs/01_estimacion_personal_roles_carga.md || exit 1
          test -f docs/02_estimaciones_tiempo_costo_historias_usuario.md || exit 1
          test -f docs/03_trazabilidad_costo_calidad_sprint2.md || exit 1
          test -f docs/04_operatividad_tablero_github_projects.md || exit 1
          test -f docs/05_matriz_riesgos_proyecto_recursos_juridicos.md || exit 1
          echo "Todos los documentos maestros (01 al 05) existen en docs/."

      - name: "Validación de Balance de Horas del Tablero Kanban eduScrum"
        run: |
          python3 scripts/generar_tablero_issues.py

      - name: "Auditoría Automática de la Matriz de Riesgos Multidimensional"
        run: |
          python3 scripts/auditoria_matriz_riesgos.py

      - name: "Dictamen de Calidad Automatizado"
        run: |
          echo "=========================================================="
          echo "  CALIDAD APROBADA - CRITERIOS SPRINT 3 CUMPLIDOS AL 100%"
          echo "  Planificación, Tablero Kanban y Matriz de Riesgos"
          echo "  Instituto Tecnológico de Tlaxiaco - TecNM"
          echo "=========================================================="
