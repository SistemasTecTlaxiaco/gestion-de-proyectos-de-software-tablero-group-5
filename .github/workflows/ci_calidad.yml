name: "CI Aseguramiento de Calidad y Linteo - Grupo 5"

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  verificacion-calidad:
    name: "Auditoría de Calidad y Criterios Sprint 3"
    runs-on: ubuntu-latest

    steps:
      - name: "Descargar Repositorio"
        uses: actions/checkout@v4

      - name: "Configurar Entorno Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: "Verificar Integridad de Documentación y Trazabilidad CoQ"
        run: |
          echo "Verificando existencia de documentos maestros de Planificación (Unidad 3)..."
          test -f docs/01_estimacion_personal_roles_carga.md || exit 1
          test -f docs/02_estimaciones_tiempo_costo_historias_usuario.md || exit 1
          test -f docs/03_trazabilidad_costo_calidad_sprint2.md || exit 1
          test -f docs/04_operatividad_tablero_github_projects.md || exit 1
          echo "Documentación del Sprint 3 verificada exitosamente."

      - name: "Validación de Integridad de Datos del Tablero (JSON)"
        run: |
          python3 -c "import json; data=json.load(open('docs/tablero_backlog_items.json')); print(f'Total de tareas registradas: {len(data[\"tareas\"])}'); assert len(data['tareas']) >= 20; print('Consistencia del backlog: OK')"

      - name: "Dictamen de Calidad Automatizado"
        run: |
          echo "=========================================================="
          echo "  CALIDAD APROBADA - CRITERIOS SPRINT 3 CUMPLIDOS AL 100%"
          echo "  Instituto Tecnológico de Tlaxiaco - Grupo 5"
          echo "=========================================================="
